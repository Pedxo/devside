<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Meta tags -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Favicon -->

    <!-- Title -->
    <title>Pedxo | Apply to be a developer</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />

    <!-- Css -->
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/variants.css" />
    <link rel="stylesheet" href="css/responsive.css" />

    <!-- icons -->
      <script src="https://code.iconify.design/3/3.1.0/iconify.min.js"></script>
  </head>
  <body>
    <div class="wrapper">
      <header>
        <h1 class="heading-1">Pedxo Developer Form</h1>
        <p class="paragraph-text">
          Fill in the form below to complete your application to be a pedxo
          developer.
        </p>
      </header>

      <form id="developer-form" novalidate>

        <div class="custom-input">
          <label for="firstName">First Name <span>*</span></label>
          <input
            type="text"
            name="firstName"
            placeholder="Enter first name..."
            required
            id="firstName"
          />
          <span class="error-message" id="firstName-error"></span>
        </div>

        <div class="custom-input">
          <label for="lastName">Last Name <span>*</span></label>
          <input type="text" name="lastName" id="lastName" placeholder="Enter last name..." required />
           <span class="error-message" id="lastName-error"></span>
        </div>

        <!-- email -->
        <div class="custom-input">
          <label for="email">Email address <span>*</span></label>
          <input type="email" name="email" placeholder="Enter email address" required/>
          <span class="error-message" id="email-error"></span>
        </div>

        <!-- role  -->
      <div class="custom-input">
      <label for="roleTitle">Role title <span>*</span></label>
      <select name="roleTitle" id="role-select" required>
        <option value="">Select your role</option>
        <option value="Data annotator">Data annotator</option>
        <option value="UI/UX designer">UI/UX designer</option>
        <option value="Frontend developer">Frontend developer</option>
        <option value="Backend developer">Backend developer</option>
        <option value="Mobile developer">Mobile developer</option>
        <option value="Full-stack developer">Full-stack developer</option>
        <option value="Devops engineer">Devops engineer</option>
        <option value="Data scientist">Data scientist</option>
        <option value="Prompt engineer">Prompt engineer</option>
        <option value="Creative engineer">Creative engineer</option>
        <option value="Research engineer">Research engineer</option>
        <option value="Vibe coder">Vibe coder</option>
        <option value="UX experimenter">UX experimenter</option>
        <option value="UI researcher">UI researcher</option>
        <option value="Visual/animation designer">Visual/animation designer</option>
        <option value="Code annotation">Code annotation</option>
        <option value="Ghostbuster">Ghostbuster</option>
        <option value="Content Moderator & rater">Content Moderator & rater</option>
        <option value="Code reviewer">Code reviewer</option>
        <option value="Video editor">Video editor</option>
        <option value="Agent operator">Agent operator</option>
        <option value="ML researcher">ML researcher</option>
        <option value="ML engineer">ML engineer</option>
        <option value="Graphics designer + illustrator">Graphics designer + illustrator</option>
        <option value="3D Artist/Developer">3D Artist/Developer</option>
        <option value="Game developer">Game developer</option>
        <option value="Design engineer">Design engineer</option>
        <option value="Robotic engineer">Robotics engineer</option>
        <option value="Hardware engineer">Hardware engineer</option>
        <option value="Rider">Rider</option>
      </select>
      <span class="error-message" id="roleTitle-error"></span>
      </div>

      <!-- github -->
      <div class="custom-input">
          <label for="githubAccount">GitHub Account <span id="githubAccount-required"></span></label>
          <input
            type="url"
            name="githubAccount"
            id="githubAccount"
            placeholder="Enter your GitHub profile link"
          />
          <span class="error-message" id="githubAccount-error"></span>
        </div>

        <!-- portfolio -->
        <div class="custom-input">
          <label for="portfolioLink">Portfolio Link <span>*</span></label>
          <input
            type="url"
            name="portfolioLink"
            id="portfolioLink"
            placeholder="Drop link to your portfolio or a project you're proud of"
            required
          />
          <span class="error-message" id="portfolioLink-error"></span>
        </div>

      <!-- NEW FIELD 1 : HOME ADDRESS (Required)                     -->

      <div class="custom-input">
        <label for="homeAddress">
          Home Address <span>*</span>
        </label>

        <input
          type="text"
          id="homeAddress"
          name="homeAddress"
          placeholder="Enter your home address"
          required
        />

        <span
          class="error-message"
          id="homeAddress-error">
        </span>
      </div>

      <!-- NEW FIELD 2 : SOCIAL MEDIA PROFILES (Optional)            -->
  
      <div class="custom-input">

        <label for="socialMediaProfiles">
          Social Media Profile URLs
        </label>

        <button
          type="button"
          id="open-social-modal"
          class="social-btn">

          + Add Social Media Profiles

        </button>

        <small class="helper-text">
          This field is optional.
        </small>

      </div>

      <!-- Hidden input that stores all URLs before form submission -->

      <input
        type="hidden"
        id="socialMediaProfiles"
        name="socialMediaProfiles"
      />

        <!-- experience -->

        <div class="custom-input">
          <label for="experienceLevel">Experience Level <span>*</span></label>
          <select name="experienceLevel" id="experienceLevel" required>
            <option value="">Select your experience level</option>
            <option value="Beginner">Beginner</option>
            <option value="Intermediate">Intermediate</option>
            <option value="Senior">Senior</option>
          </select>
          <span class="error-message" id="experienceLevel-error"></span>
        </div>
        
       

      <!-- whatsapp number  -->
           <div class="custom-input select-box">
             <label for="whatsappNumber">WhatsApp Number <span>*</span></label>
                <div style="display: flex; gap: 0.5rem;" class="selected-option">
                    <div>
                        <span class="iconify" data-icon="flag:gb-4x3"></span>
                        <!-- <strong>+44</strong> -->
                    </div>

                    
                    <input type="tel"
                     name="whatsappNumber"
                     placeholder="Phone Number"
                     required
                     id="whatsappNumber"
                     title="Enter a valid phone number"
                     style="flex: 1;">

                    </div>
                    <span class="error-message" id="whatsappNumber-error"></span>

                <div class="options">
                    <input type="text" class="search-box" placeholder="Search Country Name">
                    <ol>
                  
                    </ol>
                </div>
           </div>


           <!-- country -->

        <div class="custom-input">
          <label for="country">Country <span>*</span></label>
          <select name="country" id="country-select" required>
            <option value="">Select Country</option>
          </select>
          <span class="error-message" id="country-error"></span>
        </div>

        <!-- state -->
        <div class="custom-input">
          <label for="state">State <span>*</span></label>
          <select name="state" id="state-select" required></select>
          <span class="error-message" id="state-error"></span>
        </div>

        <!-- city -->
        <div class="custom-input">
          <label for="city">City <span>*</span></label>
          <select name="city" id="city-select" required></select>
          <span class="error-message" id="city-error"></span>
        </div>

        <!-- gender -->
        <div class="custom-input">
          <label for="gender">Gender <span>*</span></label>
          <select name="gender" id="gender-select" required>
            <option value="male">Male</option>
            <option value="female">Female</option>
          </select>
          <span class="error-message" id="gender-error"></span>
        </div>

        <!-- dob -->
         

          <div class="custom-input">
          <label for="dateOfBirth">Date of Birth<span>*</span></label>
          <input type="date" id="dateOfBirth" name="dateOfBirth" required />
          <span class="error-message" id="dateOfBirth-error"></span>
        </div>
        
        <!-- bank -->
        <div class="custom-input">
          <label for="bankName">Bank Name<span>*</span></label>
          <input type="text" name="bankName" id="bankName" placeholder="Enter bank name" required />
          <span class="error-message" id="bankName-error"></span>
        </div>
        
        <!-- Account Number -->
        <div class="custom-input">
          <label for="accountNumber">Account Number<span>*</span></label>
          <input
            type="text"
            pattern="\d{10}"
            maxlength="10"
            name="accountNumber"
            placeholder="Enter 10 digit account number"
            required
            id="accountNumber"
          />
          <span class="error-message" id="accountNumber-error"></span>
        </div>

        <!-- token -->
          <div class="custom-input">
          <label for="token">Token<span>*</span></label>
          <input type="token" name="token" placeholder="Enter your token" required/>
          <span class="error-message" id="token-error"></span>
        </div>

       <!-- <button type="submit">Register</button> -->
        <button type="submit" id="btn-submit" class="btn btn-submit">Submit</button>
        <p id="success-message"></p>



      <!-- SOCIAL MEDIA MODAL                                        -->
      <!-- Opens when user clicks Add Social Media Profiles          -->

      <div
      id="social-media-modal"
      class="modal-overlay">

      <div class="modal-content">

        <div class="modal-header">

          <h2>Social Media Profile URLs</h2>

          <button
            type="button"
            id="close-social-modal"
            class="close-modal">

            &times;

          </button>

        </div>

        <div class="modal-body">

          <div class="custom-input">
            <label for="linkedinUrl">LinkedIn</label>

            <input
              type="url"
              id="linkedinUrl"
              placeholder="https://linkedin.com/in/yourname">
              <span class="error-message" id="linkedinUrl-error"></span>
          </div>

          <div class="custom-input">
            <label for="gitlabUrlModal">GitLab</label>

            <input
              type="url"
              id="gitlabUrlModal"
              placeholder="https://gitlab.com/username">
              <span class="error-message" id="gitlabUrlModal-error"></span>
          </div>

          <div class="custom-input">
            <label for="twitterUrl">Twitter / X</label>

            <input
              type="url"
              id="twitterUrl"
              placeholder="https://x.com/username">
              <span class="error-message" id="twitterUrl-error"></span>
          </div>

          <div class="custom-input">
            <label for="facebookUrl">Facebook</label>

            <input
              type="url"
              id="facebookUrl"
              placeholder="https://facebook.com/username">
              <span class="error-message" id="facebookUrl-error"></span>
          </div>

          <div class="custom-input">
            <label for="instagramUrl">Instagram</label>

            <input
              type="url"
              id="instagramUrl"
              placeholder="https://instagram.com/username">
              <span class="error-message" id="instagramUrl-error"></span>
          </div>

          <div class="custom-input">
            <label for="tiktokUrl">TikTok</label>

            <input
              type="url"
              id="tiktokUrl"
              placeholder="https://tiktok.com/@username">
              <span class="error-message" id="tiktokUrl-error"></span>
          </div>

          <div class="custom-input">
            <label for="youtubeUrl">YouTube</label>

            <input
              type="url"
              id="youtubeUrl"
              placeholder="https://youtube.com/@channel">
              <span class="error-message" id="youtubeUrl-error"></span>
          </div>

          <div class="custom-input">
            <label for="behanceUrl">Behance</label>

            <input
              type="url"
              id="behanceUrl"
              placeholder="https://behance.net/username">
              <span class="error-message" id="behanceUrl-error"></span>
          </div>

          <div class="custom-input">
            <label for="dribbbleUrl">Dribbble</label>

            <input
              type="url"
              id="dribbbleUrl"
              placeholder="https://dribbble.com/username">
              <span class="error-message" id="dribbbleUrl-error"></span>
          </div>

          <div class="custom-input">
            <label for="otherSocialUrl">
              Other Profile
            </label>

            <input
              type="url"
              id="otherSocialUrl"
              placeholder="https://example.com/profile">
              <span class="error-message" id="otherSocialUrl-error"></span>
          </div>

        </div>

        <div class="modal-footer">

          <button
            type="button"
            id="cancel-social-btn">

            Cancel

          </button>

          <button
            type="button"
            id="save-social-btn">

            Save

          </button>

        </div>

      </div>

      </div>
      </form>

    </div>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script type="module" src="./js/api.js">
      import axios from "axios"
    </script>
    <script src="js/index.js"></script>
    <script src="js/config.js"></script>
    <script src="js/phone.js"></script>
  </body>
</html>
